version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: pi2_fauna_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fauna_admin
      POSTGRES_PASSWORD: faunasecret2026
      POSTGRES_DB: fauna_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fauna_admin -d fauna_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
