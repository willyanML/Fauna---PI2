<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Degradê de fundo: forest-600 (#32725e) -> forest-700 (#2a5c4c) -> forest-900 (#203e35) -->
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32725e" />
      <stop offset="50%" stop-color="#2a5c4c" />
      <stop offset="100%" stop-color="#203e35" />
    </linearGradient>

    <!-- Brilho radial superior sutil (from-white/20 to-transparent) -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="85%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Sombra sutil da pata (drop-shadow-sm) -->
    <filter id="pawShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container com cantos arredondados (rounded-xl proporcional: rx="26") e borda forest-500/30 -->
  <rect x="2" y="2" width="96" height="96" rx="26" ry="26" fill="url(#forestGrad)" stroke="#448f75" stroke-opacity="0.45" stroke-width="2.5" />

  <!-- Destaque de luz radial superior -->
  <rect x="2" y="2" width="96" height="96" rx="26" ry="26" fill="url(#topGlow)" />

  <!-- Lucide PawPrint em amber-300 (#fcd34d) centralizado -->
  <g transform="translate(23, 23) scale(2.25)" filter="url(#pawShadow)">
    <!-- 3 Dedos da pata -->
    <circle cx="11" cy="4" r="2" fill="#fcd34d" stroke="#fcd34d" stroke-width="0.5" />
    <circle cx="18" cy="8" r="2" fill="#fcd34d" stroke="#fcd34d" stroke-width="0.5" />
    <circle cx="20" cy="16" r="2" fill="#fcd34d" stroke="#fcd34d" stroke-width="0.5" />
    <!-- Almofada principal da pata -->
    <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"
          fill="#fcd34d" stroke="#fcd34d" stroke-width="1.2" stroke-linejoin="round" />
  </g>
</svg>